services:
  - type: web
    name: academic-ace
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: academic-ace-db
          property: connectionString
      - key: CURRENCY
        value: ZMW
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_WEBHOOK_SECRET
        sync: false
      - key: UPLOAD_FOLDER
        value: /var/data/academic-ace-uploads
    disk:
      name: academic-ace-files
      mountPath: /var/data
      sizeGB: 10
  - type: pgsql
    name: academic-ace-db
    plan: free

  # Attach persistent private storage before accepting real uploads.
